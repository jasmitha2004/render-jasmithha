# Render Blueprint — ContextBridge AI
# Django API + Streamlit UI + static landing page, and one PostgreSQL database.
databases:
  - name: contextbridge-db
    plan: free            # Render free Postgres expires after 30 days; upgrade for persistence
    databaseName: contextbridge
    user: contextbridge

services:
  # ---------------------------------------------------------------------------
  # SERVICE 1 — Django REST API (gunicorn)
  # ---------------------------------------------------------------------------
  - type: web
    name: contextbridge-backend
    runtime: python
    plan: free
    # collectstatic is added to the build so WhiteNoise can serve admin/DRF assets.
    buildCommand: pip install -r requirements.txt && cd backend && python manage.py collectstatic --noinput
    # Optional demo seeding (SEED_DEMO_DATA=true) runs after migrations; skipped by default.
    startCommand: cd backend && python manage.py migrate --noinput && ([ "$SEED_DEMO_DATA" != "true" ] || python sample_data_generator.py) && gunicorn contextbridge.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: contextbridge-db
          property: connectionString
      # RENDER_EXTERNAL_HOSTNAME is injected by Render and auto-added to ALLOWED_HOSTS / CSRF origins.
      - key: DJANGO_ALLOWED_HOSTS
        value: contextbridge-backend.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://contextbridge-backend.onrender.com,https://contextbridge-frontend.onrender.com
      - key: SEED_DEMO_DATA
        value: "true"
      - key: DEMO_PASSWORD
        sync: false            # choose the demo account password in the dashboard
      - key: ANTHROPIC_API_KEY
        sync: false            # optional; leave empty for rule-based mode
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-5

  # ---------------------------------------------------------------------------
  # SERVICE 2 — Streamlit frontend
  # ---------------------------------------------------------------------------
  - type: web
    name: contextbridge-frontend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run frontend/app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      # If Render appends a suffix to the service URL, update this to the backend's real URL + /api.
      - key: CONTEXTBRIDGE_API
        value: https://contextbridge-backend.onrender.com/api
      - key: CONTEXTBRIDGE_DEMO_MODE
        value: "false"
      - key: CONTEXTBRIDGE_SITE_URL
        value: https://contextbridge-landing.onrender.com

  # ---------------------------------------------------------------------------
  # SERVICE 3 — Public landing page (static site, no build step)
  # Edit landing/config.js so appUrl points at the Streamlit service above.
  # ---------------------------------------------------------------------------
  - type: web
    name: contextbridge-landing
    runtime: static
    staticPublishPath: ./landing
